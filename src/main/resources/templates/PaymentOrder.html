<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pay Order</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>
<div class="container my-2">
    <h2>Pay Order</h2>
    <a th:href="@{/}" class="btn btn-primary btn-sm mb-3">Home</a>

    <div>
        <h4>Order ID: <span th:text="${order.id}"></span></h4>
        <p>Author: <span th:text="${order.author}"></span></p>
        <p>Order Time: <span th:text="${#dates.format(order.orderTime, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
        <p>Status: <span th:text="${order.status}"></span></p>
    </div>

    <form th:action="@{/order/pay/{orderId}(orderId=${order.id})}" method="post">
        <div class="form-group">
            <label for="methodSelect">Payment Method</label>
            <select name="method" id="methodSelect" class="form-control">
                <option value="BANK_TRANSFER">Bank Transfer</option>
                <option value="VOUCHER">Voucher</option>
            </select>
        </div>
        <div class="form-group">
            <label for="bankName">Bank Name</label>
            <input type="text" name="bankName" id="bankName" class="form-control" placeholder="Enter Bank Name">
        </div>
        <div class="form-group">
            <label for="referenceCode">Reference Code</label>
            <input type="text" name="referenceCode" id="referenceCode" class="form-control" placeholder="Enter Reference Code">
        </div>
        <div class="form-group">
            <label for="voucherCode">Voucher Code</label>
            <input type="text" name="voucherCode" id="voucherCode" class="form-control" placeholder="Enter Voucher Code">
        </div>
        <button type="submit" class="btn btn-primary">Pay Now</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
        crossorigin="anonymous"></script>
</body>
</html>
