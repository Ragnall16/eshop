<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Admin Detail</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>

<div class="container my-2">
    <h2>Payment Admin Detail</h2>
    <a th:href="@{/payment/admin/list}" class="btn btn-primary btn-sm mb-3">Payment List</a>

    <div class="card mb-3">
        <div class="card-body">
            <h5 class="card-title">Payment ID: <span th:text="${payment.id}"></span></h5>
            <p class="card-text"><strong>Method:</strong> <span th:text="${payment.method}"></span></p>
            <p class="card-text"><strong>Status:</strong> <span th:text="${payment.status}"></span></p>
            <h6>Payment Data:</h6>
            <ul>
                <li th:each="entry : ${payment.paymentData.entrySet()}">
                    <span th:text="${entry.key}"></span>: <span th:text="${entry.value}"></span>
                </li>
            </ul>
        </div>
    </div>

    <h3>Set Status for Payment</h3>
    <form th:action="@{/payment/admin/set-status/{id}(id=${payment.id})}" method="post" style="display:inline;">
        <input type="hidden" name="status" value="SUCCESS"/>
        <button type="submit" class="btn btn-success" id="acceptButton">Accept</button>
    </form>
    <form th:action="@{/payment/admin/set-status/{id}(id=${payment.id})}" method="post" style="display:inline;">
        <input type="hidden" name="status" value="REJECTED"/>
        <button type="submit" class="btn btn-danger" id="rejectButton">Reject</button>
    </form>



    <div th:if="${param.error}" class="alert alert-danger mt-3">
        <p th:text="${param.error}"></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
        crossorigin="anonymous"></script>
</body>
</html>
