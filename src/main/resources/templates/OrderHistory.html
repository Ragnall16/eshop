<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order History</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>

<div class="container my-2">
    <h2>Order History</h2>
    <a th:href="@{/}" class="btn btn-primary btn-sm mb-3">Home</a>
    <a th:href="@{/product/list}" class="btn btn-primary btn-sm mb-3">Product List</a>
    <a th:href="@{/order/create}" class="btn btn-primary btn-sm mb-3">Create Order</a>

    <table border="1" class="table table-striped table-responsive-md">
        <thead>
        <tr>
            <th scope="col">Author</th>
            <th scope="col">Order Time</th>
            <th scope="col">Status</th>
            <th scope="col">Products</th>
            <th scope="col">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order: ${orders}">
            <td th:text="${order.author}"></td>
            <td th:text="${#dates.format(order.orderTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td th:text="${order.status}"></td>
            <td>
                <ul>
                    <li th:each="product : ${order.products}" th:text="${product.productName} + ' (' + ${product.productQuantity} + ')'"></li>
                </ul>
            </td>
            <td>
                <a th:href="@{/order/pay/{orderId}(orderId=${order.id})}" class="btn btn-success btn-sm">Pay</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
        crossorigin="anonymous"></script>
</body>
</html>
